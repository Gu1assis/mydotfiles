# ~/.config/fuzzel/fuzzel.ini

[main]
font=JetBrains Mono:size=11
dpi-aware=yes
fields=name,generic,comment,exec
terminal=foot                  # Mude para o seu emulador de terminal se necessário

# Ajustes de tamanho e centralização
width=40                       # Largura em número de caracteres
tabs=4
horizontal-pad=15
vertical-pad=15
inner-pad=8

lines=10                       # Número de aplicativos visíveis na lista
image-size-ratio=0             # Define como 0 para remover ícones se quiser estilo dmenu puro

[colors]
# Formato das cores: RRGGBBAA (Vermelho, Verde, Azul, Alfa/Transparência)
background=1e1e2eff           # Fundo escuro (estilo Catppuccin Mocha)
text=cdd6f4ff                 # Texto principal claro
match=f38ba8ff                # Cor das letras que combinam com a pesquisa
selection=313244ff            # Cor de fundo do item selecionado
selection-text=cdd6f4ff       # Cor do texto do item selecionado
selection-match=f38ba8ff      # Cor das letras que combinam no item selecionado
border=89b4faf0               # Cor da borda fina da janela

[border]
width=2
radius=6                       # Cantos levemente arredondados

